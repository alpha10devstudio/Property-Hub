name: Build Property Hub Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PropertyHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release Keystore (alpha10-release.p12)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
              echo "Release signing secrets unavailable in pull_request context; skipping signed release APK."
              exit 0
            fi
            echo "::error::Missing required release signing secret(s): ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi

          KEYSTORE_FILE="${{ runner.temp }}/alpha10-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded alpha10-release.p12 keystore file is empty."
            exit 1
          fi

          KEYTOOL_OUT=$(LC_ALL=C keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS")

          KEYSTORE_SHA256=$(printf '%s\n' "$KEYTOOL_OUT" | grep -i 'SHA256:' | head -n 1 | cut -d':' -f2- | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$KEYSTORE_SHA256" ]; then
            echo "::error::Failed to extract SHA-256 certificate fingerprint from alpha10-release.p12."
            exit 1
          fi

          echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          echo "KEYSTORE_SHA256=$KEYSTORE_SHA256" >> "$GITHUB_ENV"
          echo "Decoded alpha10-release.p12 (PKCS12) and extracted Master SHA-256 fingerprint."

      - name: Build & Verify Signed Release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Signed release APK was not generated at $RELEASE_APK."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK")
          printf '%s\n' "$VERIFY_OUT"

          APK_SHA256=$(printf '%s\n' "$VERIFY_OUT" | grep -i 'Signer #1 certificate SHA-256 digest:' | head -n 1 | cut -d':' -f2- | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "Master Keystore SHA-256: $KEYSTORE_SHA256"
          echo "Release APK SHA-256    : $APK_SHA256"

          if [ -z "$APK_SHA256" ] || [ "$APK_SHA256" != "$KEYSTORE_SHA256" ]; then
            echo "::error::Release APK SHA-256 signing certificate fingerprint does not match Master Keystore!"
            exit 1
          fi
          echo "Verified: Release APK SHA-256 certificate fingerprint matches alpha10-release.p12."

      - name: Upload Signed Release APK Artifact
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PropertyHub-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/alpha10-release.p12"
